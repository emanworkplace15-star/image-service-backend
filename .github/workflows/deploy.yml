name: Backend CI/CD

on:
  push:
    branches: [ main ]

permissions:
  id-token: write   # required for AWS OIDC — no static keys in repo secrets
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::233338945000:role/GitHubActionsWorkflowRole
          aws-region: us-east-1

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: image-service-backend
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
                       -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Image summary
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: image-service-backend
          IMAGE_TAG: ${{ github.sha }}
        run: echo "Pushed $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG (+ latest)" >> $GITHUB_STEP_SUMMARY

      # ECS never watches ECR on its own — the pipeline is the trigger.
      # The service starts a rolling deployment: new task registers with the
      # ALB, the old one drains once the new one is healthy.
      - name: Trigger ECS redeploy
        run: |
          aws ecs update-service \
            --cluster image-service \
            --service backend \
            --force-new-deployment \
            --region us-east-1 \
            --query 'service.[serviceName,status,runningCount,desiredCount]' \
            --output table